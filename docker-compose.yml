version: '3.8'

services:
  wedding-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding-invitation
    ports:
      - "13000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - wedding-network
    # Add health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  wedding-network:
    driver: bridge
