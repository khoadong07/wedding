    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Landing page styles */
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap');

        .vs-cc {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
            background: #f0f8f0;
        }

        .vs-cc-backdrop { position: absolute; inset: 0; }

        /* Sparkles */
        .vs-cc-sparkle {
            position: absolute;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
            pointer-events: none;
            animation: vsCcSparkle 3s ease-in-out infinite;
        }
        .vs-cc-sparkle:nth-child(2) { top: 15%; left: 18%; animation-delay: 0s; }
        .vs-cc-sparkle:nth-child(3) { top: 28%; right: 12%; animation-delay: 0.8s; width: 3px; height: 3px; }
        .vs-cc-sparkle:nth-child(4) { bottom: 22%; left: 14%; animation-delay: 1.6s; width: 5px; height: 5px; }
        .vs-cc-sparkle:nth-child(5) { bottom: 32%; right: 20%; animation-delay: 2.4s; }

        @keyframes vsCcSparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* Floating petals */
        .vs-cc-petal {
            position: absolute;
            width: 10px; height: 10px;
            opacity: 0.4;
            pointer-events: none;
        }
        .vs-cc-petal svg { width: 100%; height: 100%; }
        .vs-cc-petal:nth-child(6) { top: 10%; right: 8%; animation: vsCcPetal1 6s ease-in-out infinite; }
        .vs-cc-petal:nth-child(7) { top: 18%; left: 10%; animation: vsCcPetal2 8s ease-in-out infinite 1s; width: 8px; height: 8px; }
        .vs-cc-petal:nth-child(8) { bottom: 18%; right: 12%; animation: vsCcPetal1 7s ease-in-out infinite 2s; width: 7px; height: 7px; }

        @keyframes vsCcPetal1 {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(15deg); }
        }
        @keyframes vsCcPetal2 {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(-12deg); }
        }

        /* Card */
        .vs-cc-card {
            position: relative;
            z-index: 1;
            width: 82%;
            max-width: 320px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            padding: 28px 20px;
            background: #f4f7f0;
        }

        .vs-cc-card-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.12;
            pointer-events: none;
        }

        /* Corner decorations */
        .vs-cc-corner-tl, .vs-cc-corner-tr, .vs-cc-corner-bl, .vs-cc-corner-br {
            position: absolute;
            width: 60px;
            height: 60px;
            pointer-events: none;
            z-index: 2;
        }
        .vs-cc-corner-tl svg, .vs-cc-corner-tr svg, .vs-cc-corner-bl svg, .vs-cc-corner-br svg {
            width: 100%; height: 100%;
        }
        .vs-cc-corner-tl { top: 4px; left: 4px; }
        .vs-cc-corner-tr { top: 4px; right: 4px; }
        .vs-cc-corner-bl { bottom: 4px; left: 4px; }
        .vs-cc-corner-br { bottom: 4px; right: 4px; }

        .vs-cc-card-inner {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* Heart */
        .vs-cc-heart {
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: vsCcPulse 2s ease-in-out infinite;
            background: #5c6b4f;
        }
        .vs-cc-heart svg { width: 18px; height: 18px; fill: white; }
        @keyframes vsCcPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* Names */
        .vs-cc-names {
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            line-height: 1.2;
            padding: 0 8px;
            font-family: 'Playfair Display', serif;
            color: #3a4a30;
        }

        /* Divider */
        .vs-cc-divider {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 80%;
        }
        .vs-cc-divider-line { flex: 1; height: 1px; opacity: 0.5; background: #8a9e78; }
        .vs-cc-divider-icon { width: 12px; height: 12px; flex-shrink: 0; }
        .vs-cc-divider-icon svg { width: 100%; height: 100%; fill: #5c6b4f; }

        /* Date */
        .vs-cc-date {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1px;
            color: #5c6b4f;
        }

        /* Invite text */
        .vs-cc-invite {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #3a4a30;
        }

        /* Guest name */
        .vs-cc-guest {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #5c6b4f;
        }

        /* Button */
        .vs-cc-btn {
            margin-top: 4px;
            padding: 8px 28px;
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            background: #5c6b4f;
        }
        .vs-cc-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        /* Sage theme colors */
        .vs-cc[data-theme="sage"] .vs-cc-backdrop { background: #5c6b4f; }
        .vs-cc[data-theme="sage"] .vs-cc-petal svg { fill: #8a9e78; }

        /* Envelope animation */
        .vs-cc[data-animation="envelope"].vs-cc-opening .vs-cc-card {
            animation: vsCcEnvelope 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            transform-origin: top center;
        }
        .vs-cc[data-animation="envelope"].vs-cc-opening .vs-cc-backdrop,
        .vs-cc[data-animation="envelope"].vs-cc-opening .vs-cc-petal {
            animation: vsCcFadeOut 0.4s 0.6s ease forwards;
        }
        @keyframes vsCcEnvelope {
            0% { transform: perspective(800px) rotateX(0); opacity: 1; }
            40% { transform: perspective(800px) rotateX(-30deg) translateY(-20px); opacity: 1; }
            100% { transform: perspective(800px) rotateX(-90deg) translateY(-80px); opacity: 0; }
        }
        @keyframes vsCcFadeOut { to { opacity: 0; } }

        /* Wedding content styles */
        #wedding-content {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #5c6b4f;
        }

        /* Hide landing when wedding content is shown */
        .wedding-active .vs-cc {
            display: none !important;
        }
        .wedding-active #wedding-content {
            display: block !important;
        }

        /* QR Code Styles */
        .vs-qr-content.vs-hidden { display: none; }
        .vs-qr-content.vs-reveal { animation: qr-reveal 0.4s ease-out; }
        @keyframes qr-reveal { 
            from { opacity: 0; transform: translateY(-8px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        @keyframes vs-envelope-shake {
            0%, 100% { transform: rotate(0deg); }
            10% { transform: rotate(-3deg); }
            20% { transform: rotate(3deg); }
            30% { transform: rotate(-2deg); }
            40% { transform: rotate(2deg); }
            50% { transform: rotate(0deg); }
        }

        .vs-envelope-shake {
            animation: vs-envelope-shake 2.5s ease-in-out infinite !important;
        }

        .vs-qr-btn {
            text-align: center;
            margin: 20px 0;
        }

        .vs-qr-close {
            cursor: pointer;
            display: inline-block;
            padding: 8px 24px;
            border-radius: 25px;
            background: rgba(0,0,0,0.08);
            color: #666;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .vs-qr-close:hover {
            opacity: 0.9;
        }
    </style>
</head>

        function initializeWeddingScripts() {
            // Wait a bit for DOM to be ready
            setTimeout(() => {
                // Re-initialize WOW animations
                if (typeof WOW !== 'undefined') {
                    new WOW().init();
                }
                
                // Initialize countdown manually
                initCountdown();
                
                // Initialize lightbox if available
                if (window.jQuery && jQuery.fn.magnificPopup) {
                    jQuery('.lightbox-image').magnificPopup({
                        type: 'image',
                        gallery: {
                            enabled: true
                        }
                    });
                }
                
                // Re-initialize QR code functionality
                initQRCode();
            }, 100);
        }

        function initCountdown() {
            const countdownElement = document.querySelector('.time-countdown');
            if (!countdownElement) return;
            
            const targetDate = new Date('2026-12-25T00:00:00').getTime();
            
            function updateCountdown() {
                const now = new Date().getTime();
                const distance = targetDate - now;
                
                if (distance < 0) {
                    document.querySelector('.vs-time-days').textContent = '0';
                    document.querySelector('.vs-time-hours').textContent = '0';
                    document.querySelector('.vs-time-minutes').textContent = '0';
                    document.querySelector('.vs-time-seconds').textContent = '0';
                    return;
                }
                
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                
                document.querySelector('.vs-time-days').textContent = days;
                document.querySelector('.vs-time-hours').textContent = hours;
                document.querySelector('.vs-time-minutes').textContent = minutes;
                document.querySelector('.vs-time-seconds').textContent = seconds;
            }
            
            updateCountdown();
            setInterval(updateCountdown, 1000);
        }

        function initQRCode() {
            // QR code functionality
            document.querySelectorAll('.vs-qr-content').forEach(function(c){
                c.style.display='';
                c.classList.add('vs-hidden');
            });
            
            document.querySelectorAll('.vs-qr-btn').forEach(function(b){
                var p=b.parentElement;
                var hasContent=p.querySelector('.vs-qr-content');
                if(!hasContent){
                    var sib=b.nextElementSibling;
                    while(sib){
                        if(sib.classList&&sib.classList.contains('vs-qr-content')){
                            hasContent=sib;break;
                        }
                        sib=sib.nextElementSibling;
                    }
                }
                if(!hasContent){
                    b.style.display='none';
                    return;
                }
                
                b.addEventListener('click',function(){
                    var p=this.parentElement;
                    var c=p.querySelector('.vs-qr-content');
                    if(!c){
                        var sib=this.nextElementSibling;
                        while(sib){
                            if(sib.classList&&sib.classList.contains('vs-qr-content')){
                                c=sib;break;
                            }
                            sib=sib.nextElementSibling;
                        }
                    }
                    if(c){
                        c.classList.remove('vs-hidden');
                        c.classList.add('vs-reveal');
                    }
                    this.style.display='none';
                });
            });
            
            document.querySelectorAll('.vs-qr-close').forEach(function(x){
                x.addEventListener('click',function(){
                    var c=this.closest('.vs-qr-content');
                    if(c){
                        c.classList.add('vs-hidden');
                        c.classList.remove('vs-reveal');
                        var p=c.parentElement;
                        var b=p.querySelector('.vs-qr-btn');
                        if(!b){
                            var sib=c.previousElementSibling;
                            while(sib){
                                if(sib.classList&&sib.classList.contains('vs-qr-btn')){
                                    b=sib;break;
                                }
                                sib=sib.previousElementSibling;
                            }
                        }
                        if(b){b.style.display='';}
                    }
                });
            });
        }
    </script>
